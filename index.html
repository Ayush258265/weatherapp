<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Weather App</title>
</head>
<body>
    <div class="hello">
    <div class="container">
        <div class="weather_container">
            
            <div class="temp">
                <p class="temperature">20°C</p>
            </div>
            
            <div class="time_location">
                <p class="cityname">New York</p>
                <p class="time">12:00 PM</p>
            </div>

            <div class="weather_status">
                <p class="condition">Sunny</p>
                 <img class="weather_icon" src="" alt="Weather Icon">
            </div>

        </div>
    </div>

    <nav>
        <form class="search_form">
            <input type="text" placeholder="Enter city name" class="search_area" />
            <button type="submit">Get Weather</button>
        </form>
    </nav>
    </div>
    <script src="index.js"></script>
</body>
</html>
